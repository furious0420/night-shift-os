<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Night Shift OS — Allan Suraj</title>
  <meta name="description" content="A haunted retro computer you boot at 3 AM. Portfolio of Allan Suraj — ML, AGI, metal, trivia, travel and true crime.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Boot screen -->
  <section id="boot" aria-label="Boot sequence">
    <pre id="boot-log" aria-live="polite"></pre>
    <button id="boot-btn" class="btn hidden" type="button">&gt; ENTER THE NIGHT SHIFT_</button>
    <p class="boot-hint">Press any key to skip</p>
  </section>

  <!-- Desktop -->
  <main id="desktop" class="hidden" aria-label="Night Shift OS desktop">
    <div id="wallpaper" aria-hidden="true">
      <div class="wp-title">NIGHT SHIFT OS</div>
      <div class="wp-motto"></div>
    </div>
    <nav id="icons" aria-label="Applications"></nav>
    <div id="windows"></div>
    <div id="whisper" aria-hidden="true"></div>
  </main>

  <footer id="taskbar" class="hidden">
    <button id="start-btn" class="btn" type="button" aria-haspopup="true" aria-expanded="false">☾ START</button>
    <div id="tasks" aria-label="Open windows"></div>
    <button id="motion-btn" class="btn small" type="button" title="Toggle CRT effects">CRT: ON</button>
    <time id="clock"></time>
  </footer>
  <div id="start-menu" class="hidden" role="menu"></div>

  <div id="crt" aria-hidden="true"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
